<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Go2 gait control in Webots</title><desc id="desc">12 model joints: 8 torque-controlled thigh/calf joints + 4 position-controlled hips</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#168c7a" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" rx="24" fill="#f3f7fa"/><text x="42" y="58" font-family="Arial, sans-serif" font-size="32" fill="#17324d" font-weight="700">Go2 gait control in Webots</text><text x="42" y="93" font-family="Arial, sans-serif" font-size="19" fill="#486277" font-weight="400">12 model joints: 8 torque-controlled thigh/calf joints + 4 position-controlled hips</text><rect x="42" y="132" width="315" height="165" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="64" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Gait planner</text><text x="64" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Trot / walk / pronk</text><text x="64" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Bézier swing + stance</text><text x="64" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Desired foot x-z targets</text><rect x="442" y="132" width="315" height="165" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="464" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Planar leg IK</text><text x="464" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Two links: 0.213 m each</text><text x="464" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Thigh / calf angle targets</text><text x="464" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Hip target stays at zero</text><rect x="842" y="132" width="315" height="165" rx="16" fill="#e3f5f0" stroke="#168c7a" stroke-width="2"/><text x="864" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Joint SMC</text><text x="864" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">PD + saturation + gravity</text><text x="864" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Filtered angle differences</text><text x="864" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Clipped torque commands</text><path d="M357 213 H430" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M757 213 H830" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="842" y="397" width="315" height="162" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="864" y="435" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Webots Go2</text><text x="864" y="471" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">16 ms world timestep</text><text x="864" y="501" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Motors + position sensors</text><text x="864" y="531" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Measured joint angles</text><rect x="442" y="397" width="315" height="162" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="464" y="435" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">CSV + offline plots</text><text x="464" y="471" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Log every fifth step</text><text x="464" y="501" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Save around each 30 s</text><text x="464" y="531" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Foot logs = desired targets</text><rect x="42" y="397" width="315" height="162" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="64" y="435" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Startup sequence</text><text x="64" y="471" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">0-1 s: standing</text><text x="64" y="501" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">1-1.5 s: transition</text><text x="64" y="531" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">From 1.5 s: cyclic gait</text><path d="M1000 297 V385" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="1016" y="351" font-family="Arial, sans-serif" font-size="18" fill="#168c7a" font-weight="700">torque</text><path d="M1105 397 V328 H1150 V297" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="1045" y="372" font-family="Arial, sans-serif" font-size="18" fill="#168c7a" font-weight="700">feedback</text><path d="M842 478 H769" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="754" y="373" font-family="Arial, sans-serif" font-size="18" fill="#168c7a" font-weight="700">targets + feedback</text><text x="42" y="623" font-family="Arial, sans-serif" font-size="21" fill="#17324d" font-weight="700">The Python plugin controls Webots devices directly through webots_ros2_driver.</text></svg>
